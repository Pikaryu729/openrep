<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon-dark.svg" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenRep</title>
    <script>
      // Apply the persisted theme before first paint to avoid a flash of the
      // default look. Kept in sync with src/lib/theme.ts (openrep.theme key).
      //
      // This script does no theme math on purpose: saveTheme() precomputes the
      // full CSS-variable map for both modes into `vars`, so all that is left
      // here is picking a mode and replaying it. Anything cleverer would be a
      // second implementation of resolveColors() that could drift from the
      // first. `accent`/`accentContrast` are the v1 shape, still honoured so a
      // theme saved before the editor existed does not flash on upgrade.
      ;(function () {
        var root = document.documentElement
        try {
          var theme = JSON.parse(localStorage.getItem('openrep.theme') || 'null') || {}
          var mode =
            theme.mode === 'light' || theme.mode === 'dark'
              ? theme.mode
              : matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          root.dataset.mode = mode
          root.dataset.theme = theme.preset || 'graphite'

          var vars = theme.vars && theme.vars[mode]
          if (vars) {
            for (var name in vars) {
              if (Object.prototype.hasOwnProperty.call(vars, name)) {
                root.style.setProperty(name, vars[name])
              }
            }
          } else if (theme.accent) {
            root.style.setProperty('--accent', theme.accent)
            root.style.setProperty('--accent-contrast', theme.accentContrast || '#ffffff')
          }
        } catch (error) {
          root.dataset.mode = 'light'
          root.dataset.theme = 'graphite'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
