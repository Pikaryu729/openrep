[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "openrep"
version = "0.1.0"
description = "A local-first strength training tracker — one command, your data on your machine."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["fitness", "strength-training", "workout-tracker", "local-first", "self-hosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Other/Nonlisted Topic",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
]

[project.scripts]
openrep = "openrep.cli:main"

[project.urls]
Homepage = "https://github.com/Pikaryu729/openrep"
Repository = "https://github.com/Pikaryu729/openrep"
Changelog = "https://github.com/Pikaryu729/openrep/blob/main/CHANGELOG.md"
Issues = "https://github.com/Pikaryu729/openrep/issues"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["openrep"]
# openrep/static/ is generated by scripts/build-dist.sh and gitignored.
# Hatchling's file selection is VCS-aware, so without this the bundled UI is
# silently dropped from the wheel and the app boots API-only.
artifacts = ["openrep/static/**"]

[tool.hatch.build.targets.sdist]
# `uv build` builds the wheel from the sdist, so the assets must survive here too.
include = ["/openrep", "/tests", "/alembic.ini", "/README.md", "/LICENSE"]
artifacts = ["openrep/static/**"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["openrep/migrations/versions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
